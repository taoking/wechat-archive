[package]
name = "wechat-key-extractor"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "=1.0.102"
libc = "=0.2.185"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.140"
regex = "=1.12.3"
hmac = "=0.12.1"
sha2 = "=0.10.9"
pbkdf2 = "=0.12.2"

[profile.release]
strip = true
